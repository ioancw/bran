[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bran"
version = "0.1.0"
description = "A fleet-orchestration agent platform built on the Claude Agent SDK — like Claude Code, but general-purpose."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ioan Williams" }]
dependencies = [
    "claude-agent-sdk>=0.2.82",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bran = "bran.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sorting, UP pyupgrade, B bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length — long strings/URLs are fine, not worth wrapping
    "B008",   # call-in-default — Typer *requires* `= typer.Option(...)` params
    "B904",   # raise-without-from — bran raises clean user-facing messages by design
    "E402",   # deliberate late imports (after env/guard setup) in a few modules
    "E702",   # compact multi-statement lines in test stand-ins
]
