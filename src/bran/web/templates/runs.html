{% extends 'base.html' %}
{% block title %}bran · runs{% endblock %}
{% block heading %}Runs{% endblock %}
{% block subheading %}{{ runs|length }} shown{% endblock %}

{% block header_actions %}
<form method="get" class="flex items-center gap-2">
  <select name="agent" onchange="this.form.submit()" class="field" style="width: auto; font-size: 11px;">
    <option value="">all agents</option>
    {% for p in agents %}
      <option value="{{ p.name }}" {% if p.name == agent_filter %}selected{% endif %}>{{ p.name }}</option>
    {% endfor %}
  </select>
  <select name="status" onchange="this.form.submit()" class="field" style="width: auto; font-size: 11px;">
    <option value="">any status</option>
    {% for s in ('completed', 'running', 'pending', 'failed') %}
      <option value="{{ s }}" {% if s == status_filter %}selected{% endif %}>{{ s }}</option>
    {% endfor %}
  </select>
</form>
{% endblock %}

{% block content %}
  {% include 'partials/runs_table.html' %}
{% endblock %}
