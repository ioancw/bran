<table class="bran-table">
  <thead>
    <tr>
      <th style="width: 90px;">ID</th>
      <th>Agent</th>
      <th style="width: 110px;">Status</th>
      <th style="width: 160px;">Started</th>
      <th class="num" style="width: 80px;">Duration</th>
      <th class="num" style="width: 80px;">Cost</th>
      <th>Task</th>
    </tr>
  </thead>
  <tbody id="runs-tbody">
    {% for run in runs %}
      {% include 'partials/run_row.html' %}
    {% else %}
      <tr><td colspan="7" style="padding: 0;">
        <div class="empty-state">
          <div class="brackets">[       ]</div>
          <h3>no runs yet</h3>
          <p class="cta">try: <code>bran "your question here"</code></p>
        </div>
      </td></tr>
    {% endfor %}
  </tbody>
</table>
