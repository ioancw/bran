<tr id="sched-{{ s.id }}">
  <td><span class="text-bright" style="font-weight: 500;">{{ s.name }}</span></td>
  <td>{{ s.agent }}</td>
  <td class="mono">{{ s.cron }}</td>
  <td class="text-dim" style="max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ s.task or '—' }}</td>
  <td>
    <button class="btn-ghost danger"
            hx-delete="/ui/schedules/{{ s.name }}"
            hx-target="#sched-{{ s.id }}"
            hx-swap="outerHTML"
            hx-confirm="Remove schedule '{{ s.name }}'?">
      remove
    </button>
  </td>
</tr>
